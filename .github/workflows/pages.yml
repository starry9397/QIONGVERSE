name: Deploy QIONGVERSE to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate locales
        run: npm run check:i18n
      - name: Build static frontend
        env:
          VITE_BASE_PATH: /QIONGVERSE/
          VITE_PUBLIC_SITE_URL: https://starry9397.github.io/QIONGVERSE
          VITE_LUOYIN_API_BASE_URL: https://qiongverse-api.onrender.com
          # GitHub Pages artifacts intentionally omit files >= 24 MiB. Keep
          # existing large project media in the repository and load it from
          # GitHub's read-only Raw CDN in the public build.
          VITE_LARGE_MEDIA_BASE_URL: https://raw.githubusercontent.com/starry9397/QIONGVERSE/main/public
        run: npm run build
      - name: Adapt root asset references for project Pages path
        env:
          VITE_BASE_PATH: /QIONGVERSE/
        run: npm run prepare:pages
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
