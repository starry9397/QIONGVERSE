services:
  - type: web
    name: qiongverse-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run server
    healthCheckPath: /healthz
    envVars:
      - key: LUOYIN_SERVER_HOST
        value: 0.0.0.0
      - key: LUOYIN_TRUST_PROXY
        value: "1"
      - key: LUOYIN_ALLOWED_ORIGINS
        value: https://qiongverse.pages.dev,https://starry9397.github.io,https://qiongverse-webify-qiongverse-webify-d5drsw1e9a5fd4.webapps.tcloudbase.com
      - key: SOCIAL_PUBLIC_BASE_URL
        value: https://qiongverse-webify-qiongverse-webify-d5drsw1e9a5fd4.webapps.tcloudbase.com
      - key: SOCIAL_CALLBACK_BASE_URL
        value: https://qiongverse-api.onrender.com
      - key: GLM_API_KEY
        sync: false
